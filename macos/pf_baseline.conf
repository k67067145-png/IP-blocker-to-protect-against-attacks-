# ROCKET Shield — macOS pf baseline
# Loaded into the main pf.conf via an anchor, so it coexists with any
# rules already on the system instead of replacing them.

table <rocket_blocklist> persist

# Fast path: known-bad sources
block quick from <rocket_blocklist> to any

# Basic SYN flood dampening
pass in proto tcp flags S/SA keep state \
    (max-src-conn 200, max-src-conn-rate 200/5, overload <rocket_blocklist> flush global)

pass in proto icmp icmp-type echoreq keep state (max-src-conn-rate 50/1)