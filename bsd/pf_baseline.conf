# ROCKET Shield baseline PF configuration

set block-policy drop
set skip on lo

scrub in all

antispoof quick for lo

table <rocket_shield_blocked> persist

block in quick from <rocket_shield_blocked>

pass out all keep state

pass in on egress proto tcp to port 22 flags S/SA keep state
pass in on egress proto tcp to port 80 flags S/SA keep state
pass in on egress proto tcp to port 443 flags S/SA keep state

# Basic TCP flood protection
pass in on egress proto tcp to port { 80, 443 } \
    flags S/SA \
    keep state \
    max-src-conn 100 \
    max-src-conn-rate 50/10

# ICMP protection
pass in on egress proto icmp max-pkt-rate 100/10